<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" role="img" aria-label="Valóság Rései — univerzum">
  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0930"/>
      <stop offset="55%" stop-color="#080522"/>
      <stop offset="100%" stop-color="#040312"/>
    </linearGradient>

    <!-- csillagködök -->
    <radialGradient id="nebPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#b7a6ff" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#8f74ff" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#8f74ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebCream" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f5f1ff" stop-opacity="0.7"/>
      <stop offset="60%" stop-color="#d6ccff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#d6ccff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebGold" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f2e2bd" stop-opacity="0.6"/>
      <stop offset="55%" stop-color="#e8cf9a" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#e8cf9a" stop-opacity="0"/>
    </radialGradient>

    <!-- galaxismag -->
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="18%" stop-color="#fbf3ff" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#cdbcff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#8f74ff" stop-opacity="0"/>
    </radialGradient>

    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="softer" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>

  <rect width="600" height="800" fill="url(#space)"/>

  <!-- csillagködök, lágyan elmosva -->
  <g filter="url(#softer)">
    <ellipse cx="250" cy="330" rx="220" ry="180" fill="url(#nebPurple)"/>
    <ellipse cx="420" cy="520" rx="180" ry="150" fill="url(#nebGold)"/>
    <ellipse cx="180" cy="560" rx="150" ry="130" fill="url(#nebCream)"/>
  </g>

  <!-- galaxis: megdöntött spirál korongok -->
  <g transform="translate(300 360) rotate(-28)" opacity="0.9">
    <g filter="url(#soft)">
      <ellipse cx="0" cy="0" rx="230" ry="78" fill="url(#nebPurple)" opacity="0.5"/>
    </g>
    <g fill="none" stroke="#d6ccff" stroke-opacity="0.22">
      <ellipse cx="0" cy="0" rx="210" ry="68"/>
      <ellipse cx="0" cy="0" rx="160" ry="50"/>
      <ellipse cx="0" cy="0" rx="110" ry="34"/>
    </g>
    <!-- ragyogó mag -->
    <circle cx="0" cy="0" r="120" fill="url(#core)"/>
    <circle cx="0" cy="0" r="6" fill="#ffffff"/>
  </g>

  <!-- csillagmező -->
  <g fill="#ffffff">
    <circle cx="60"  cy="80"  r="1.4" opacity="0.8"/>
    <circle cx="140" cy="130" r="1"   opacity="0.6"/>
    <circle cx="210" cy="70"  r="1.6" opacity="0.85"/>
    <circle cx="330" cy="110" r="1"   opacity="0.55"/>
    <circle cx="470" cy="90"  r="1.5" opacity="0.8"/>
    <circle cx="540" cy="150" r="1.1" opacity="0.6"/>
    <circle cx="90"  cy="250" r="1.2" opacity="0.6"/>
    <circle cx="520" cy="280" r="1.4" opacity="0.75"/>
    <circle cx="50"  cy="420" r="1"   opacity="0.55"/>
    <circle cx="560" cy="430" r="1.3" opacity="0.7"/>
    <circle cx="110" cy="640" r="1.5" opacity="0.8"/>
    <circle cx="250" cy="700" r="1.1" opacity="0.6"/>
    <circle cx="380" cy="660" r="1.3" opacity="0.7"/>
    <circle cx="500" cy="640" r="1"   opacity="0.55"/>
    <circle cx="300" cy="600" r="1.2" opacity="0.6"/>
    <circle cx="170" cy="200" r="1"   opacity="0.5"/>
    <circle cx="430" cy="230" r="1.1" opacity="0.6"/>
  </g>
  <!-- arany csillagok -->
  <g fill="#f2e2bd">
    <circle cx="200" cy="150" r="1.6" opacity="0.9"/>
    <circle cx="480" cy="500" r="1.5" opacity="0.85"/>
    <circle cx="120" cy="480" r="1.4" opacity="0.8"/>
  </g>

  <!-- csillag-szikrák (négyágú) -->
  <g fill="#ffffff" opacity="0.95">
    <path d="M150 90 L153 100 L163 103 L153 106 L150 116 L147 106 L137 103 L147 100 Z"/>
    <path d="M450 380 L454 393 L467 397 L454 401 L450 414 L446 401 L433 397 L446 393 Z" opacity="0.9"/>
    <path d="M95 560 L98 569 L107 572 L98 575 L95 584 L92 575 L83 572 L92 569 Z" fill="#f2e2bd" opacity="0.9"/>
  </g>

  <!-- cím -->
  <text x="300" y="392" text-anchor="middle" fill="#ffffff" font-family="'Sora', 'Inter', sans-serif" font-size="48" font-weight="600" letter-spacing="-1" style="paint-order:stroke">Valóság</text>
  <text x="300" y="448" text-anchor="middle" fill="#ffffff" font-family="'Sora', 'Inter', sans-serif" font-size="48" font-weight="600" letter-spacing="-1">Rései</text>
  <text x="300" y="735" text-anchor="middle" fill="#e8cf9a" font-family="'Inter', sans-serif" font-size="14" letter-spacing="7">EBOOK</text>
</svg>
