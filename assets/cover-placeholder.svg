<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" role="img" aria-label="Valóság Résein — absztrakt borító">
  <defs>
    <radialGradient id="orb1" cx="35%" cy="30%" r="60%">
      <stop offset="0" stop-color="#b9a3ff"/>
      <stop offset="55%" stop-color="#6f4bff"/>
      <stop offset="100%" stop-color="#1a1140" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="70%" cy="72%" r="55%">
      <stop offset="0" stop-color="#f2e2bd"/>
      <stop offset="50%" stop-color="#c9a45f" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#c9a45f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#100b30"/>
      <stop offset="1" stop-color="#07061a"/>
    </linearGradient>
  </defs>

  <rect width="600" height="800" fill="url(#bg)"/>

  <!-- lágy gradiens orbok -->
  <circle cx="230" cy="250" r="260" fill="url(#orb1)"/>
  <circle cx="410" cy="560" r="230" fill="url(#orb2)" opacity="0.85"/>

  <!-- finom koncentrikus körök -->
  <g fill="none" stroke="#e8cf9a" stroke-opacity="0.18">
    <circle cx="300" cy="400" r="150"/>
    <circle cx="300" cy="400" r="210"/>
  </g>

  <!-- apró csillagok -->
  <g fill="#ffffff">
    <circle cx="120" cy="140" r="1.6" opacity="0.8"/>
    <circle cx="480" cy="180" r="1.4" opacity="0.7"/>
    <circle cx="520" cy="360" r="1.2" opacity="0.6"/>
    <circle cx="90"  cy="520" r="1.5" opacity="0.7"/>
    <circle cx="180" cy="660" r="1.3" opacity="0.6"/>
    <circle cx="420" cy="700" r="1.6" opacity="0.75"/>
  </g>

  <text x="300" y="395" text-anchor="middle" fill="#f4f1ff" font-family="'Sora', 'Inter', sans-serif" font-size="50" font-weight="600" letter-spacing="-1">Valóság</text>
  <text x="300" y="452" text-anchor="middle" fill="#f4f1ff" font-family="'Sora', 'Inter', sans-serif" font-size="50" font-weight="600" letter-spacing="-1">Résein</text>
  <text x="300" y="730" text-anchor="middle" fill="#e8cf9a" font-family="'Inter', sans-serif" font-size="14" letter-spacing="7">EBOOK</text>
</svg>
