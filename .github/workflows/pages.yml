name: Deploy to GitHub Pages

# Kpublikálja a statikus oldalt GitHub Pages-re minden main-re pusholáskor.
# A CNAME (saját domain) ELŐNÉZETHEZ szándékosan nincs jelen — élesítéskor
# visszatesszük a repo gyökerébe a valosagresei.com tartalommal.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages (enable if needed)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
